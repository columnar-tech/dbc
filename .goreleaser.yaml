# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: dbc
metadata:
  description: "The command line tool for installing and managing ADBC drivers"
  license: Apache-2.0
  homepage: "https://columnar.tech/dbc"
  maintainers:
    - "Columnar <hello@columnar.tech>"

git:
  tag_sort: smartsemver

builds:
  - id: dbc
    main: ./cmd/dbc
    binary: dbc
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post: # sign the windows binaries
        - if: '{{ and (eq .Os "windows") (isEnvSet "SM_API_KEY") }}'
          cmd: >-
            smctl sign --keypair-alias "{{ .Env.SM_KEYPAIR_ALIAS }}" --input "{{ .Path }}" --config-file "{{ .Env.PKCS11_CONFIG }}"
  # dbc's C API as a static library for the columnar-dbc Rust crates. cgo is
  # cross-compiled on this one runner with Zig as the C compiler; the Zig
  # targets set the glibc (2.28) and macOS (12.0) floors the crates document.
  # check_glibc_floor.py enforces the glibc floor on every Linux build, before
  # anything is packaged or published.
  - id: capi
    main: ./capi
    binary: libdbc
    buildmode: c-archive
    flags:
      - -trimpath
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - windows_amd64_v1
    overrides:
      - goos: linux
        goarch: amd64
        goamd64: v1
        env: [CGO_ENABLED=1, "CC=zig cc -target x86_64-linux-gnu.2.28"]
      - goos: linux
        goarch: arm64
        goarm64: v8.0
        env: [CGO_ENABLED=1, "CC=zig cc -target aarch64-linux-gnu.2.28"]
      - goos: darwin
        goarch: amd64
        goamd64: v1
        env: [CGO_ENABLED=1, "CC=zig cc -target x86_64-macos.12.0"]
      - goos: darwin
        goarch: arm64
        goarm64: v8.0
        env: [CGO_ENABLED=1, "CC=zig cc -target aarch64-macos.12.0"]
      - goos: windows
        goarch: amd64
        goamd64: v1
        env: [CGO_ENABLED=1, "CC=zig cc -target x86_64-windows-gnu"]
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - if: '{{ eq .Os "linux" }}'
          cmd: python3 scripts/check_glibc_floor.py "{{ .Path }}" {{ .Arch }}
          output: true
        - cmd: python3 scripts/stage_capi.py "{{ .Path }}" {{ .Os }} {{ .Arch }} {{ .Version }}
          output: true
  # Linux shared library for the development packages.
  - id: capi-shared
    main: ./capi
    binary: libdbc
    buildmode: c-shared
    flags:
      - -trimpath
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w
      # Go's -s doesn't strip the C linker's debug sections from a c-shared
      # library; --strip-all does (lintian: unstripped-binary-or-object).
      - -extldflags=-Wl,-soname,libdbc.so,--strip-all
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
    overrides:
      - goos: linux
        goarch: amd64
        goamd64: v1
        env: [CGO_ENABLED=1, "CC=zig cc -target x86_64-linux-gnu.2.28"]
      - goos: linux
        goarch: arm64
        goarm64: v8.0
        env: [CGO_ENABLED=1, "CC=zig cc -target aarch64-linux-gnu.2.28"]
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: python3 scripts/check_glibc_floor.py "{{ .Path }}" {{ .Arch }}
          output: true
        - cmd: python3 scripts/stage_devel.py "{{ .Path }}" {{ .Arch }} {{ .Version }} {{ .CommitDate }}
          output: true

archives:
  - id: archives
    ids:
      - dbc
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- if eq .Arch "386" }}x86
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}-{{ .Version }}
    files:
      - 'LICENSE*'
      - 'README*'
      - src: 'cmd/dbc/completions/dbc.*'
        strip_parent: true
      - src: '{{ .ArtifactPath }}*.sig'
        strip_parent: true
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    hooks:
      after:
        # build wheels for each platform we built for
        - if: '{{ ne .Os "freebsd" }}'
          cmd: >-
            uv run ./scripts/create_wheels.py --binary_version {{ .RawVersion }}{{ .Prerelease }}
            --platform={{ .Os }}-{{- if eq .Arch "386" }}x86{{else}}{{ .Arch }}{{ end }} --archive=dist/{{ .ProjectName }}-
            {{- .Os }}-
            {{- if eq .Arch "386" }}x86
            {{- else }}{{ .Arch }}{{ end }}
            {{- if .Arm }}v{{ .Arm }}{{ end }}-{{ .Version }}{{ if eq .Os "windows" }}.zip{{ else }}.tar.gz{{ end }}

  # Static libdbc for macOS and Windows: libdbc.a (libdbc.lib on Windows),
  # libdbc.h, and on macOS a relocatable dbc.pc. Linux ships as deb/rpm instead.
  - id: libdbc-dev
    ids:
      - capi
    name_template: "libdbc-dev_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: "dist/devel/{{ .Os }}_{{ .Arch }}/*.pc"
        strip_parent: true

blobs:
  - ids:
      - archives
      - libdbc-dev
      - msi
      - pkgs
      - devel-deb
      - devel-rpm
    provider: s3
    if: '{{ not (contains .ArtifactName ".msi.sig" )}}'
    region: us-east-2
    bucket: dbc-distribution
    directory: "{{ .Version }}"
    include_meta: true

binary_signs:
  # windows binaries are signed in-place and not detached, so we don't provide a .sig for them
  - id: signs
    ids:
      - dbc
    if: '{{ ne .Os "windows" }}'
    signature: '${artifact}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}.sig'
    args: ["--output", "${signature}", "-u", "hello@columnar.tech", "--detach-sign", "${artifact}"]
    stdin: "{{ .Env.SIGNING_PASSWORD }}"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+(/[[:word:]]+)*\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+(/[[:word:]]+)*\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - image_templates:
    - "columnar/dbc:{{ .Version }}-amd64"
    ids:
      - dbc
    use: buildx
    dockerfile: Dockerfile
    skip_push: false
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
    - "columnar/dbc:{{ .Tag }}-amd64"
    - "columnar/dbc:v{{ .Major }}-amd64"
    - "columnar/dbc:v{{ .Major }}.{{ .Minor }}-amd64"
    - "columnar/dbc:latest-amd64"
    ids:
      - dbc
    use: buildx
    dockerfile: Dockerfile
    skip_push: auto
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
    - "columnar/dbc:{{ .Version }}-arm64v8"
    ids:
      - dbc
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    skip_push: false
    build_flag_templates:
      - "--platform=linux/arm64/v8"
  - image_templates:
    - "columnar/dbc:{{ .Tag }}-arm64v8"
    - "columnar/dbc:v{{ .Major }}-arm64v8"
    - "columnar/dbc:v{{ .Major }}.{{ .Minor }}-arm64v8"
    - "columnar/dbc:latest-arm64v8"
    ids:
      - dbc
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    skip_push: auto
    build_flag_templates:
      - "--platform=linux/arm64/v8"

docker_manifests:
  - name_template: "columnar/dbc:{{ .Version }}"
    image_templates:
      - "columnar/dbc:{{ .Version }}-amd64"
      - "columnar/dbc:{{ .Version }}-arm64v8"
  - name_template: "columnar/dbc:v{{ .Major }}"
    skip_push: auto
    image_templates:
      - "columnar/dbc:v{{ .Major }}-amd64"
      - "columnar/dbc:v{{ .Major }}-arm64v8"
  - name_template: "columnar/dbc:v{{ .Major }}.{{ .Minor }}"
    skip_push: auto
    image_templates:
      - "columnar/dbc:v{{ .Major }}.{{ .Minor }}-amd64"
      - "columnar/dbc:v{{ .Major }}.{{ .Minor }}-arm64v8"
  - name_template: "columnar/dbc:{{ .Tag }}"
    skip_push: auto
    image_templates:
      - "columnar/dbc:{{ .Tag }}-amd64"
      - "columnar/dbc:{{ .Tag }}-arm64v8"
  - name_template: "columnar/dbc:latest"
    skip_push: auto
    image_templates:
      - "columnar/dbc:latest-amd64"
      - "columnar/dbc:latest-arm64v8"

