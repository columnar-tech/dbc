nfpms:
  - id: pkgs
    ids:
      - dbc
    package_name: dbc
    file_name_template: "{{ .ConventionalFileName }}"
    if: '{{ eq .Os "linux" }}'
    vendor: Columnar Technologies Inc.
    homepage: "https://columnar.tech/dbc"
    license: Apache-2.0

    description: >-
      The command line tool for installing and managing ADBC drivers

    formats:
      - deb
      - rpm
    meta: false
    priority: extra
    contents:
      - src: cmd/dbc/completions/dbc.bash
        dst: /etc/bash_completion.d/dbc

      - src: cmd/dbc/completions/dbc.zsh
        dst: /usr/share/zsh/vendor-completions/_dbc

      - src: cmd/dbc/completions/dbc.fish
        dst: /usr/share/fish/vendor_completions.d/dbc.fish

  # Only capi supplies automatic artifacts: adding capi-shared would duplicate
  # libdbc.h, which nfpm does not deduplicate. Stage the shared library explicitly.
  # Both packages are checked by scripts/lint_devel_packages.sh in release.yml.
  - id: devel-deb
    ids: [capi]
    package_name: libdbc-dev
    file_name_template: "{{ .ConventionalFileName }}"
    if: '{{ eq .Os "linux" }}'
    vendor: Columnar Technologies Inc.
    homepage: "https://columnar.tech/dbc"
    # No `license`: nfpm would write it as a nonstandard deb control field;
    # Debian carries the license in the copyright file below.
    maintainer: "Columnar <hello@columnar.tech>"
    description: &devel-description |-
      C API development files for dbc, the ADBC driver installer
      dbc finds, installs, and verifies ADBC drivers. This package provides the
      static and shared libdbc libraries, the libdbc.h header, and the dbc
      pkg-config module for building programs against the dbc C API.
    formats: [deb]
    section: libdevel
    priority: optional
    release: "1"
    changelog: dist/devel/changelog.yml
    dependencies:
      - libc6 (>= 2.28)
    deb:
      triggers:
        activate_noawait: [ldconfig]
      lintian_overrides:
        # libdbc.so has an unversioned SONAME on purpose: it ships only in this
        # development package, with no runtime package to version.
        - package-name-doesnt-match-sonames libdbc
        - shared-library-lacks-version
        # GoReleaser packages build artifacts (libdbc.a, libdbc.h) with mode
        # 0755 and has no setting to change it.
        - executable-not-elf-or-script
    libdirs:
      header: /usr/include
      carchive: '/usr/lib/{{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-linux-gnu'
    contents:
      - src: dist/devel/linux_{{ .Arch }}/libdbc.so
        dst: '/usr/lib/{{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-linux-gnu/libdbc.so'
        file_info:
          mode: 0644
      - src: dist/devel/linux_{{ .Arch }}/dbc.deb.pc
        dst: '/usr/lib/{{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-linux-gnu/pkgconfig/dbc.pc'
        file_info:
          mode: 0644
      - src: resources/libdbc-dev.copyright
        dst: /usr/share/doc/libdbc-dev/copyright
        file_info:
          mode: 0644

  - id: devel-rpm
    ids: [capi]
    package_name: libdbc-devel
    file_name_template: "{{ .ConventionalFileName }}"
    if: '{{ eq .Os "linux" }}'
    vendor: Columnar Technologies Inc.
    homepage: "https://columnar.tech/dbc"
    license: Apache-2.0
    maintainer: "Columnar <hello@columnar.tech>"
    description: *devel-description
    formats: [rpm]
    release: "1"
    changelog: dist/devel/changelog.yml
    dependencies:
      - glibc >= 2.28
    provides:
      # Not templated by GoReleaser, so unversioned.
      - pkgconfig(dbc)
    rpm:
      group: Development/Libraries
    libdirs:
      header: /usr/include
      carchive: /usr/lib64
    contents:
      - src: dist/devel/linux_{{ .Arch }}/libdbc.so
        dst: /usr/lib64/libdbc.so
        # rpmlint: shared-library-not-executable
        file_info:
          mode: 0755
      - src: dist/devel/linux_{{ .Arch }}/dbc.rpm.pc
        dst: /usr/lib64/pkgconfig/dbc.pc
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/libdbc-devel/LICENSE
        type: license
        file_info:
          mode: 0644

cloudsmiths:
  - organization: columnar
    repository: dbc
    ids:
      - pkgs
      - devel-deb
      - devel-rpm
    formats:
      - deb
      - rpm
    # dbc is a static binary and libdbc targets glibc 2.28+ in the standard
    # Debian multiarch/RPM lib64 paths, so publish distro-agnostic packages
    distributions:
      deb: "any-distro/any-version"
      rpm: "any-distro/any-version"
    component: main
    # skip prereleases, matching homebrew/winget skip_upload: auto
    disable: '{{ ne .Prerelease "" }}'
    republish: true


snapcrafts:
  - id: snaps
    ids:
      - dbc
    name: dbc
    summary: The command line tool for installing and managing ADBC drivers
    description: The command line tool for installing and managing ADBC drivers
    icon: ./resources/dbc.png
    hooks:
      install:
        plugs:
          - network
    base: bare
    confinement: classic
    publish: false
    plugs:
      system-files:
        read:
          - /etc/adbc
        write:
          - /etc/adbc
      personal-files:
        read:
          - $HOME/.config/adbc
        write:
          - $HOME/.config/adbc

msi:
  - id: msi
    ids:
      - dbc
    name: "dbc-{{ .Version }}-{{ .MsiArch }}"
    wxs: ./resources/dbc.wxs
    extensions:
      - ui
    extra_files:
      - ./resources/dbc.ico
      - ./resources/dbc.bmp
      - ./ui/bitmaps/dlgbmp.bmp
      - ./ui/bitmaps/bannrbmp.bmp

signs:
  - id: signature-archives
    artifacts: archive
    ids:
      - archives
    args: ["--output", "${signature}", "-u", "hello@columnar.tech", "--detach-sign", "${artifact}"]
  - id: sign-windows-msi
    if: '{{ isEnvSet "SM_API_KEY" }}'
    artifacts: installer # Windows MSI installers
    cmd: jsign
    args: ["-keystore", "{{ .Env.PKCS11_CONFIG }}",
      "-storepass", "NONE", "-storetype", "PKCS11", "-alg", "SHA-256", "-tsaurl", "http://timestamp.digicert.com",
      "--name", "{{ .ProjectName }} Installer", "-alias", "{{ .Env.SM_KEYPAIR_ALIAS }}", "${artifact}"]

after:
  hooks:
    - mkdir -p dist/python
    - cmd: sh -c "mv dist/*.whl dist/python/"
    # columnar-dbc crates, using the archives staged by the capi build hook.
    - cmd: python3 scripts/publish_crates.py --version {{ .Version }} --dry-run
      if: "{{ .IsSnapshot }}"
      output: true
    - cmd: python3 scripts/publish_crates.py --version {{ .Version }}
      if: "{{ not .IsSnapshot }}"
      output: true

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - dbc
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"

      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        wait: true
        timeout: 20m

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

homebrew_casks:
  - name: dbc
    alternative_names:
      - dbc@{{ .Version }}
      - dbc@{{ .Major }}.{{ .Minor }}
    ids:
      - archives
    url:
      template: "https://github.com/columnar-tech/dbc/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: "github.com/columnar-tech/dbc/"
      cookies:
        license: "accept-backup"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://columnar.tech/dbc"
    description: "The command line tool for installing and managing ADBC drivers"
    skip_upload: auto # auto skips prereleases
    completions:
      bash: dbc.bash
      zsh: dbc.zsh
      fish: dbc.fish
    repository:
      owner: "columnar-tech"
      name: "homebrew-tap"
      branch: main
      token_type: "github"
      token: "{{ .Env.DBC_TAP_GITHUB_PAT }}" # we'll probably need a dedicated PAT or something?

# Casks can only install apps and binaries, so libdbc uses a formula.
# GoReleaser deprecated `brews` in v2.10 in favor of casks, but it is still the
# only Homebrew publisher that can install into lib/ and include/.
brews:
  - name: libdbc
    alternative_names:
      - libdbc@{{ .Version }}
      - libdbc@{{ .Major }}.{{ .Minor }}
    ids:
      - libdbc-dev
    url_template: "https://github.com/columnar-tech/dbc/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "Brew formula update for libdbc version {{ .Tag }}"
    directory: Formula
    homepage: "https://columnar.tech/dbc"
    description: "Static library and headers for the C API of dbc, the ADBC driver installer"
    license: Apache-2.0
    skip_upload: auto # auto skips prereleases
    install: |
      lib.install "libdbc.a"
      include.install "libdbc.h"
      inreplace "dbc.pc", /^prefix=.*$/, "prefix=#{opt_prefix}"
      inreplace "dbc.pc", /^libdir=.*$/, "libdir=${prefix}/lib"
      inreplace "dbc.pc", /^includedir=.*$/, "includedir=${prefix}/include"
      (lib/"pkgconfig").install "dbc.pc"
    test: |
      (testpath/"test.c").write <<~C
        #include <stddef.h>
        #include <libdbc.h>
        int main(void) {
          dbc_client *client = NULL;
          dbc_error *error = NULL;
          if (dbc_client_new(NULL, NULL, 0, &client, &error) != DBC_OK) return 1;
          dbc_client_free(client);
          return 0;
        }
      C
      system ENV.cc, "test.c", "-I#{include}", "-L#{lib}", "-ldbc",
             "-framework", "CoreFoundation", "-framework", "Security", "-o", "test"
      system "./test"
    repository:
      owner: "columnar-tech"
      name: "homebrew-tap"
      branch: main
      token_type: "github"
      token: "{{ .Env.DBC_TAP_GITHUB_PAT }}"

# The cloudsmiths publisher only handles deb/rpm/apk, so the Windows
# libdbc-dev zip goes to Cloudsmith as a raw package through a custom publisher.
publishers:
  - name: cloudsmith-raw
    ids:
      - libdbc-dev
    if: '{{ eq .Os "windows" }}'
    cmd: python3 scripts/publish_cloudsmith_raw.py --version {{ .Version }} {{ .ArtifactPath }}
    env:
      - CLOUDSMITH_TOKEN={{ .Env.CLOUDSMITH_TOKEN }}
    # skip prereleases, matching the cloudsmiths publisher
    disable: '{{ ne .Prerelease "" }}'

winget:
  - name: dbc
    ids:
      - archives
    publisher: Columnar
    publisher_url: "https://columnar.tech/"
    publisher_support_url: "https://github.com/columnar-tech/dbc/issues"
    package_identifier: "Columnar.dbc"
    short_description: "dbc is a command-line tool for installing and managing ADBC drivers."
    description: "dbc is a command-line tool for installing and managing ADBC drivers."
    homepage: "https://docs.columnar.tech/dbc/"
    license: Apache-2.0
    license_url: "https://github.com/columnar-tech/dbc/blob/HEAD/LICENSE"
    release_notes_url: "https://github.com/columnar-tech/dbc/releases/tag/{{ .Tag }}"
    tags:
      - adbc
      - apache
      - apache-arrow
      - cli
      - database-connector
      - open-source
    skip_upload: auto
    repository:
      owner: columnar-tech
      name: winget-pkgs
      branch: "dbc-{{ .Version }}"
      token: "{{ .Env.DBC_WINGET_GITHUB_PAT }}"
      pull_request:
        enabled: false

release:
  ids:
    - archives
    - libdbc-dev
    - msi
    - snaps
    - pkgs
    - devel-deb
    - devel-rpm
  prerelease: auto
  extra_files:
    - glob: ./dist/*.whl
  header: >-
    ## dbc Release ({{ .Now.Format "2006-01-02" }})

  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

milestones:
  - repo:
      owner: columnar-tech
      name: dbc

    close: true
    name_template: "{{ .Version }}"
