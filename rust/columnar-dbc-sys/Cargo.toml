[package]
name = "columnar-dbc-sys"
description = "Raw FFI bindings to dbc's C ABI with bundled or system linking. Use columnar-dbc instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Two copies of the Go runtime in one binary would collide at link time;
# `links` makes Cargo reject that during resolution instead.
links = "columnar_dbc"
build = "build.rs"

[features]
default = ["bundled"]
bundled = [
    "dep:columnar-dbc-sys-linux-x64",
    "dep:columnar-dbc-sys-linux-arm64",
    "dep:columnar-dbc-sys-darwin-x64",
    "dep:columnar-dbc-sys-darwin-arm64",
    "dep:columnar-dbc-sys-windows-x64",
]
pkg-config = []

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
columnar-dbc-sys-linux-x64 = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
columnar-dbc-sys-linux-arm64 = { workspace = true, optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
columnar-dbc-sys-darwin-x64 = { workspace = true, optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
columnar-dbc-sys-darwin-arm64 = { workspace = true, optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
columnar-dbc-sys-windows-x64 = { workspace = true, optional = true }
