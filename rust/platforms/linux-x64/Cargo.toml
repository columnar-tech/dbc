[package]
name = "columnar-dbc-sys-linux-x64"
description = "Prebuilt dbc static library for Linux x86_64 (glibc 2.28+). Internal dependency of columnar-dbc-sys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"
# native/ is gitignored, so it must be listed explicitly to be packaged.
include = ["build.rs", "src/lib.rs", "native/libdbc.a"]
