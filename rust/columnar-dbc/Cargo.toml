[package]
name = "columnar-dbc"
description = "Search, resolve, install, and verify ADBC drivers from Rust with dbc, statically linked."
readme = "README.md"
keywords = ["adbc", "arrow", "database", "drivers"]
categories = ["database", "api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The integration tests read fixtures from the dbc repo (cmd/dbc/testdata),
# so they only run in-repo; keep them out of the published crate.
include = ["src/**", "README.md"]

[dependencies]
columnar-dbc-sys = { workspace = true }

[dev-dependencies]
tempfile = "3"
