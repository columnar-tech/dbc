name: Release dbc

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: snapshot
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      # pull more recent version of wixl than in the ubuntu repos
      # needed for Path Env update support
      - name: Install wixl
        run: |
          wget http://ftp.de.debian.org/debian/pool/main/m/msitools/wixl-data_0.106+repack-1_all.deb
          wget http://ftp.de.debian.org/debian/pool/main/m/msitools/wixl_0.106+repack-1_amd64.deb
          sudo apt install -y msitools ./wixl-data_0.106+repack-1_all.deb ./wixl_0.106+repack-1_amd64.deb
          rm ./wixl-data_0.106+repack-1_all.deb ./wixl_0.106+repack-1_amd64.deb

      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3

      - name: Import signing GPG key
        env:
          COLUMNAR_GPG_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          echo "$COLUMNAR_GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg -K | sed -n '/^\s/s/\s*//p')
          printf "trust\n5\ny\nquit\n" | gpg --batch --no-tty --command-fd 0 --edit-key "$KEY_ID"
          echo "default-cache-ttl 46000" >> ~/.gnupg/gpg-agent.conf
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent "RELOADAGENT" /bye
          KEYGRIP=$(gpg -K --with-keygrip | grep -m 1 "Keygrip =" | awk '{print $3}')
          gpg-connect-agent "PRESET_PASSPHRASE $KEYGRIP -1 $(echo -n '${{ secrets.SIGNING_PASSWORD }}' | od -An -t x1 | tr -d ' ')"

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Wheel
        run: pip install wheel

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run GoReleaser Snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: gorelease-snapshot
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release -p 20 --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Create and verify npm packages
        run: |
          VERSION="${{ fromJSON(steps.gorelease-snapshot.outputs.metadata).version }}"
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            node packages/npm/scripts/create_packages.js \
              --version "$VERSION" \
              --platform "$platform" \
              --archive "dist/dbc-${platform}-${VERSION}.tar.gz"
          done
          node packages/npm/scripts/create_packages.js \
            --version "$VERSION" \
            --platform windows-amd64 \
            --archive "dist/dbc-windows-amd64-${VERSION}.zip"

          # Verify we can install
          cd packages/npm/wrapper
          npm install ../packages/dbc-linux-x64
          npm install
          node bin/dbc.js --version

      - name: Upload Snapshot Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sig
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/msi/**/*.msi
            dist/python/*
            packages/npm/packages/*/
            packages/npm/wrapper/

      - name: Upload capi archives for the Rust tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capi-native
          path: rust/platforms/*/native/
          if-no-files-found: error

  production_deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write # For AWS auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          cache: false

      # pull more recent version of wixl than in the ubuntu repos
      # needed for Path Env update support
      - name: Install wixl
        run: |
          wget http://ftp.de.debian.org/debian/pool/main/m/msitools/wixl-data_0.106+repack-1_all.deb
          wget http://ftp.de.debian.org/debian/pool/main/m/msitools/wixl_0.106+repack-1_amd64.deb
          sudo apt install -y msitools ./wixl-data_0.106+repack-1_all.deb ./wixl_0.106+repack-1_amd64.deb
          rm ./wixl-data_0.106+repack-1_all.deb ./wixl_0.106+repack-1_amd64.deb

      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3

      - name: Import signing GPG key
        env:
          COLUMNAR_GPG_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          echo "$COLUMNAR_GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg -K | sed -n '/^\s/s/\s*//p')
          printf "trust\n5\ny\nquit\n" | gpg --batch --no-tty --command-fd 0 --edit-key "$KEY_ID"
          echo "default-cache-ttl 46000" >> ~/.gnupg/gpg-agent.conf
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent "RELOADAGENT" /bye
          KEYGRIP=$(gpg -K --with-keygrip | grep -m 1 "Keygrip =" | awk '{print $3}')
          gpg-connect-agent "PRESET_PASSPHRASE $KEYGRIP -1 $(echo -n '${{ secrets.SIGNING_PASSWORD }}' | od -An -t x1 | tr -d ' ')"

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: deploy-production-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Wheel
        run: pip install wheel

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: "columnar"
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # cross-platform macos notarization/signing
      - name: Install anchore/quill
        run: |
          curl -sSfL https://get.anchore.io/quill | sudo sh -s -- -b /usr/local/bin

      # setup digicert signing
      - uses: digicert/ssm-code-signing@1d820463733701cf1484c7eb5d7d24a15ca2c454  # v1.2.1
        id: digicert

      - name: Setup Certificate and Env
        run: |
          curl -fSslL https://github.com/ebourg/jsign/releases/download/7.0/jsign_7.0_all.deb -o jsign_7.0_all.deb
          sudo dpkg --install jsign_7.0_all.deb
          rm jsign_7.0_all.deb

          echo "PKCS11_CONFIG=${PKCS11_CONFIG}" >> "$GITHUB_ENV"
          SM_TOOLS_DIR=$(dirname "$(realpath "${PKCS11_CONFIG}")")
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 -d > "${SM_TOOLS_DIR}/Certificate_pkcs12.p12"
          {
            echo "SM_HOST=${{ secrets.SM_HOST }}"
            echo "SM_API_KEY=${{ secrets.SM_API_KEY }}"
            echo "SM_CLIENT_CERT_FILE=${SM_TOOLS_DIR}/Certificate_pkcs12.p12"
            echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}"
            echo "SM_KEYPAIR_ALIAS=${{ secrets.SM_KEYPAIR_ALIAS }}"
          } >> "$GITHUB_ENV"

          # clean up
          git clean -xdf
        env:
          PKCS11_CONFIG: ${{ steps.digicert.outputs.PKCS11_CONFIG }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: gorelease
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release -p 20 --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN}}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          DBC_TAP_GITHUB_PAT: ${{ secrets.DBC_TAP_GITHUB_PAT }}
          DBC_WINGET_GITHUB_PAT: ${{ secrets.DBC_WINGET_GITHUB_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # 1.14.2
        with:
          packages-dir: dist/python/

      - name: Update CF Latest Key
        if: contains(fromJSON(steps.gorelease.outputs.metadata).version, '-') == false
        run: |
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store \
            --kvs-arn=${{ secrets.AWS_CF_KVSTORE_ARN }} | jq -r '.ETag')
          aws cloudfront-keyvaluestore put-key \
            --if-match="$ETAG" \
            --kvs-arn=${{ secrets.AWS_CF_KVSTORE_ARN }} \
            --key=latest \
            --value="${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ fromJSON(steps.gorelease.outputs.metadata).version }}

  publish_npm:
    runs-on: ubuntu-latest
    environment: production
    needs: production_deploy
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # For npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}" # strip leading 'v'

          # Create packages for all platforms from the release we just published
          node packages/npm/scripts/create_packages.js --version "$VERSION"

          # Handle pre-releases: Prereleases (e.g. 0.3.0-rc1) publish under
          # 'next' so they don't become the default for 'npm install
          # @columnar-tech/dbc'
          if echo "$VERSION" | grep -q '-'; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          # Make sure to upload the platform-specific packages before the
          # wrapper since they're deps
          for pkg in packages/npm/packages/*/; do
            npm publish "$pkg" --provenance --access public --tag "$NPM_TAG"
          done
          npm publish packages/npm/wrapper --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  rust_test:
    name: rust ${{ matrix.target }}
    needs: snapshot
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: python3 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: python3 }
          - { platform: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin, python: python3 }
          - { platform: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin, python: python3 }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, python: python }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-gnu, python: python }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the snapshot's capi archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capi-native
          path: rust/platforms
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install bindgen
        shell: bash
        run: cargo install bindgen-cli --version 0.73.2 --locked
      - name: Bindings match the generated header
        shell: bash
        run: |
          ${{ matrix.python }} scripts/gen_rust_bindings.py rust/platforms/${{ matrix.platform }}/native/libdbc.h
          git diff --exit-code rust/columnar-dbc-sys/src/bindings.rs
      - name: Test
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --target ${{ matrix.target }}
      - name: Test at the user level
        shell: bash
        env:
          DBC_TEST_LEVEL_USER: "1"
        run: cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --target ${{ matrix.target }} --test levels
      - name: Test at the system level (Unixlike)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          sudo -E env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          DBC_TEST_LEVEL_SYSTEM=1
          cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --target ${{ matrix.target }} --test levels
      - name: Test at the system level (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          DBC_TEST_LEVEL_SYSTEM: "1"
        run: cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --target ${{ matrix.target }} --test levels
