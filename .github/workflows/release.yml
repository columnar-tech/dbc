name: Release dbc

on:
  push:
    tags:
      - "v*"
  pull_request:
  # A dry run of a production release: the full split and merge, including
  # signing and notarizing, with every publisher disabled (DBC_RELEASE_DRY_RUN
  # in .goreleaser.yaml) and no PyPI, npm, crates.io, or CloudFront updates.
  workflow_dispatch:

permissions: {}

# Releases are split by OS (.goreleaser.yaml `partial`): each `split` job
# builds, packages, and signs its OS's binaries, macOS on a macOS runner so the
# shared libdbc can link against Apple's frameworks. `snapshot` (pull requests)
# or `release` (tags and dry runs) then merges them: archive signatures,
# checksums, Docker images, and publishing.
jobs:
  split:
    name: split ${{ matrix.goos }}
    runs-on: ${{ matrix.os }}
    environment: ${{ github.event_name == 'pull_request' && 'snapshot' || 'production' }}
    if: github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, os: ubuntu-latest }
          - { goos: windows, os: ubuntu-latest }
          - { goos: darwin, os: macos-latest }
    env:
      GGOOS: ${{ matrix.goos }}
      PRODUCTION: ${{ github.event_name != 'pull_request' && '1' || '' }}
      DBC_RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          cache: false

      # pull more recent version of wixl than in the ubuntu repos
      # needed for Path Env update support
      - name: Install wixl
        if: matrix.goos == 'windows'
        run: |
          wget http://ftp.de.debian.org/debian/pool/main/m/msitools/wixl-data_0.106+repack-1_all.deb
          wget http://ftp.de.debian.org/debian/pool/main/m/msitools/wixl_0.106+repack-1_amd64.deb
          sudo apt install -y msitools ./wixl-data_0.106+repack-1_all.deb ./wixl_0.106+repack-1_amd64.deb
          rm ./wixl-data_0.106+repack-1_all.deb ./wixl_0.106+repack-1_amd64.deb

      - name: install nfpm
        if: matrix.goos == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Snapcraft
        if: matrix.goos == 'linux'
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3

      # binary_signs: detached signatures for the Linux and macOS binaries,
      # which the archives include. Windows binaries are signed in place.
      - name: Import signing GPG key
        if: matrix.goos != 'windows'
        env:
          COLUMNAR_GPG_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: scripts/import_signing_key.sh

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install Wheel
        run: pip install wheel

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # No caching in this workflow, which builds release artifacts: a
          # poisoned cache would reach them (zizmor cache-poisoning; see #366).
          use-cache: false

      # setup digicert signing for the Windows binaries (smctl build hook)
      - uses: digicert/ssm-code-signing@1d820463733701cf1484c7eb5d7d24a15ca2c454  # v1.2.1
        if: matrix.goos == 'windows' && env.PRODUCTION
        id: digicert

      - name: Setup Certificate and Env
        if: matrix.goos == 'windows' && env.PRODUCTION
        run: |
          echo "PKCS11_CONFIG=${PKCS11_CONFIG}" >> "$GITHUB_ENV"
          SM_TOOLS_DIR=$(dirname "$(realpath "${PKCS11_CONFIG}")")
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 -d > "${SM_TOOLS_DIR}/Certificate_pkcs12.p12"
          {
            echo "SM_HOST=${{ secrets.SM_HOST }}"
            echo "SM_API_KEY=${{ secrets.SM_API_KEY }}"
            echo "SM_CLIENT_CERT_FILE=${SM_TOOLS_DIR}/Certificate_pkcs12.p12"
            echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}"
            echo "SM_KEYPAIR_ALIAS=${{ secrets.SM_KEYPAIR_ALIAS }}"
          } >> "$GITHUB_ENV"

          # clean up
          git clean -xdf
        env:
          PKCS11_CONFIG: ${{ steps.digicert.outputs.PKCS11_CONFIG }}

      # A dry run builds the latest tag's version at this commit: skip the
      # check that HEAD is that tag.
      - name: Run GoReleaser (split)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: >-
            release -p 20 --clean --split
            ${{ github.event_name == 'pull_request' && '--snapshot' || '' }}
            ${{ github.event_name == 'workflow_dispatch' && '--skip=validate' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MACOS_SIGN_P12: ${{ env.PRODUCTION && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ env.PRODUCTION && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ env.PRODUCTION && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
          MACOS_NOTARY_KEY: ${{ env.PRODUCTION && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ env.PRODUCTION && secrets.MACOS_NOTARY_KEY_ID || '' }}

      # The merge job needs this split's GoReleaser state and artifacts, and
      # the files its hooks produced outside them: wheels and the archives
      # staged for the columnar-dbc-sys platform crates.
      - name: Upload the split
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-${{ matrix.goos }}
          path: dist/${{ matrix.goos }}/
          if-no-files-found: error
      - name: Upload the wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.goos }}
          path: dist/python/*.whl
          if-no-files-found: error
      - name: Upload the staged capi archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capi-native-${{ matrix.goos }}
          path: rust/platforms/*/native/
          if-no-files-found: error

  # Merge for pull requests: checksums, archive signatures, and Docker images,
  # then the artifacts the test jobs below use. Named `snapshot` as before.
  snapshot:
    needs: split
    runs-on: ubuntu-latest
    environment: snapshot
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import signing GPG key
        env:
          COLUMNAR_GPG_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: scripts/import_signing_key.sh

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download the splits
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: goreleaser-*
          path: ${{ runner.temp }}/splits
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist/python
          merge-multiple: true
      - name: Download the staged capi archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capi-native-*
          path: rust/platforms
          merge-multiple: true
      - name: Put the splits in place
        run: |
          for split in "$RUNNER_TEMP"/splits/goreleaser-*; do
            mv "$split" "dist/${split##*/goreleaser-}"
          done

      - name: Run GoReleaser (merge)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # The merge writes no top-level dist/metadata.json, so the action has no
      # `metadata` output; every split built the same commit, so any split's
      # metadata.json has the version.
      - name: Create and verify npm packages
        run: |
          VERSION=$(jq -r .version dist/linux/metadata.json)
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            node packages/npm/scripts/create_packages.js \
              --version "$VERSION" \
              --platform "$platform" \
              --archive "dist/${platform%-*}/dbc-${platform}-${VERSION}.tar.gz"
          done
          node packages/npm/scripts/create_packages.js \
            --version "$VERSION" \
            --platform windows-amd64 \
            --archive "dist/windows/dbc-windows-amd64-${VERSION}.zip"

          # Verify we can install
          cd packages/npm/wrapper
          npm install ../packages/dbc-linux-x64
          npm install
          node bin/dbc.js --version

      # The test jobs below expect each artifact's files at its top level, as
      # the unsplit release produced them.
      - name: Collect the artifacts for the test jobs
        run: |
          mkdir -p "$RUNNER_TEMP"/{snapshot,devel-packages,devel-archives/homebrew/Formula}
          cp dist/*/*.tar.gz dist/*/*.zip dist/*/*.sig dist/*/*.snap dist/*/*.deb dist/*/*.rpm "$RUNNER_TEMP/snapshot/"
          find dist -name '*.msi' -exec cp {} "$RUNNER_TEMP/snapshot/" \;
          cp -r dist/python "$RUNNER_TEMP/snapshot/"
          cp dist/linux/libdbc-dev_*.deb dist/linux/libdbc-devel*.rpm "$RUNNER_TEMP/devel-packages/"
          cp dist/darwin/libdbc-dev_*.tar.gz dist/windows/libdbc-dev_*.zip "$RUNNER_TEMP/devel-archives/"
          cp dist/homebrew/Formula/libdbc.rb "$RUNNER_TEMP/devel-archives/homebrew/Formula/"

      - name: Upload Snapshot Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-artifacts
          path: |
            ${{ runner.temp }}/snapshot/
            packages/npm/packages/*/
            packages/npm/wrapper/

      - name: Upload capi archives for the Rust tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capi-native
          path: rust/platforms/*/native/
          if-no-files-found: error

      - name: Upload development packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devel-packages
          path: ${{ runner.temp }}/devel-packages/
          if-no-files-found: error

      - name: Upload macOS/Windows libdbc-dev archives and Homebrew formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devel-archives
          path: ${{ runner.temp }}/devel-archives/
          if-no-files-found: error

  # Merge for tags (publishing) and dry runs (publishing nothing).
  release:
    needs: split
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      id-token: write # For AWS auth and PyPI trusted publishing
    env:
      DBC_RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # signs: detached archive signatures (GPG) and MSI signing (jsign)
      - name: Import signing GPG key
        env:
          COLUMNAR_GPG_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: scripts/import_signing_key.sh

      - uses: digicert/ssm-code-signing@1d820463733701cf1484c7eb5d7d24a15ca2c454  # v1.2.1
        id: digicert

      - name: Setup Certificate and Env
        run: |
          curl -fSslL https://github.com/ebourg/jsign/releases/download/7.0/jsign_7.0_all.deb -o jsign_7.0_all.deb
          sudo dpkg --install jsign_7.0_all.deb
          rm jsign_7.0_all.deb

          echo "PKCS11_CONFIG=${PKCS11_CONFIG}" >> "$GITHUB_ENV"
          SM_TOOLS_DIR=$(dirname "$(realpath "${PKCS11_CONFIG}")")
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 -d > "${SM_TOOLS_DIR}/Certificate_pkcs12.p12"
          {
            echo "SM_HOST=${{ secrets.SM_HOST }}"
            echo "SM_API_KEY=${{ secrets.SM_API_KEY }}"
            echo "SM_CLIENT_CERT_FILE=${SM_TOOLS_DIR}/Certificate_pkcs12.p12"
            echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}"
            echo "SM_KEYPAIR_ALIAS=${{ secrets.SM_KEYPAIR_ALIAS }}"
          } >> "$GITHUB_ENV"

          # clean up
          git clean -xdf
        env:
          PKCS11_CONFIG: ${{ steps.digicert.outputs.PKCS11_CONFIG }}

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: deploy-production-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: "columnar"
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download the splits
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: goreleaser-*
          path: ${{ runner.temp }}/splits
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist/python
          merge-multiple: true
      - name: Download the staged capi archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capi-native-*
          path: rust/platforms
          merge-multiple: true
      - name: Put the splits in place
        run: |
          for split in "$RUNNER_TEMP"/splits/goreleaser-*; do
            mv "$split" "dist/${split##*/goreleaser-}"
          done

      - name: Run GoReleaser (merge)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN}}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          DBC_TAP_GITHUB_PAT: ${{ secrets.DBC_TAP_GITHUB_PAT }}
          DBC_WINGET_GITHUB_PAT: ${{ secrets.DBC_WINGET_GITHUB_PAT }}
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to PyPI
        if: ${{ !env.DBC_RELEASE_DRY_RUN }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # 1.14.3
        with:
          packages-dir: dist/python/

      # As in `snapshot`: the merge leaves no `metadata` output, so read a split's.
      - name: Read the release version
        id: version
        run: echo "version=$(jq -r .version dist/linux/metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Update CF Latest Key
        if: ${{ !env.DBC_RELEASE_DRY_RUN && !contains(steps.version.outputs.version, '-') }}
        run: |
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store \
            --kvs-arn=${{ secrets.AWS_CF_KVSTORE_ARN }} | jq -r '.ETag')
          aws cloudfront-keyvaluestore put-key \
            --if-match="$ETAG" \
            --kvs-arn=${{ secrets.AWS_CF_KVSTORE_ARN }} \
            --key=latest \
            --value="${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

  publish_npm:
    runs-on: ubuntu-latest
    environment: production
    needs: release
    # Tags only: a dry run (workflow_dispatch) publishes nothing.
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # For npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}" # strip leading 'v'

          # Create packages for all platforms from the release we just published
          node packages/npm/scripts/create_packages.js --version "$VERSION"

          # Handle pre-releases: Prereleases (e.g. 0.3.0-rc1) publish under
          # 'next' so they don't become the default for 'npm install
          # @columnar-tech/dbc'
          if echo "$VERSION" | grep -q '-'; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          # Make sure to upload the platform-specific packages before the
          # wrapper since they're deps
          for pkg in packages/npm/packages/*/; do
            npm publish "$pkg" --provenance --access public --tag "$NPM_TAG"
          done
          npm publish packages/npm/wrapper --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  rust_test:
    name: rust ${{ matrix.target }}
    needs: snapshot
    runs-on: ${{ matrix.os }}
    # The Go runtime in a c-archive starts from a static initializer. On
    # MSVC targets it is only registered by the .CRT$XCU entry columnar-dbc-sys
    # adds (MSVC's CRT ignores the .ctors section Go uses); if that breaks, the
    # first dbc call waits forever for a runtime that never started. Fail
    # such a hang after 30 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: python3 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: python3 }
          - { platform: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin, python: python3 }
          - { platform: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin, python: python3 }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, python: python }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-gnu, python: python }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the snapshot's capi archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capi-native
          path: rust/platforms
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install bindgen
        shell: bash
        run: cargo install bindgen-cli --version 0.73.2 --locked
      - name: Bindings match the generated header
        shell: bash
        run: |
          ${{ matrix.python }} scripts/gen_rust_bindings.py rust/platforms/${{ matrix.platform }}/native/libdbc.h
          git diff --exit-code rust/columnar-dbc-sys/src/bindings.rs
      - name: Test
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --features bundled --target ${{ matrix.target }}
      - name: Test at the user level
        shell: bash
        env:
          DBC_TEST_LEVEL_USER: "1"
        run: cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --features bundled --target ${{ matrix.target }} --test levels
      - name: Test at the system level (Unixlike)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          sudo -E env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          DBC_TEST_LEVEL_SYSTEM=1
          cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --features bundled --target ${{ matrix.target }} --test levels
      - name: Test at the system level (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          DBC_TEST_LEVEL_SYSTEM: "1"
        run: cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --features bundled --target ${{ matrix.target }} --test levels

  devel_archives:
    name: devel archive ${{ matrix.target }}
    needs: snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: x86_64-pc-windows-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the snapshot's libdbc-dev archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devel-archives
          path: ${{ runner.temp }}/devel-archives
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install the Homebrew formula from the snapshot archives
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          archives="$RUNNER_TEMP/devel-archives"
          # Point the formula at the downloaded archives instead of a release.
          brew tap-new --no-git local/libdbc
          tap=$(brew --repository local/libdbc)
          sed -E "s#https://github.com/columnar-tech/dbc/releases/download/[^/]+/#file://$archives/#" \
            "$archives/homebrew/Formula/libdbc.rb" > "$tap/Formula/libdbc.rb"
          brew install pkgconf local/libdbc/libdbc
          brew test local/libdbc/libdbc
          pkg-config --modversion dbc
          test -f "$(pkg-config --variable=libdir dbc)/libdbc.a"
      - name: Test Rust with the default (pkg-config) build
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --target ${{ matrix.target }}
          # Only the static library is installed, but check the result anyway.
          for test in rust/target/${{ matrix.target }}/debug/deps/roundtrip-*; do
            [ -x "$test" ] || continue
            ! otool -L "$test" | grep -F libdbc
          done
      - name: Test Rust against the unpacked zip with DBC_SYS_LIB_DIR
        if: runner.os == 'Windows'
        run: |
          dir="$RUNNER_TEMP/libdbc"
          mkdir -p "$dir"
          unzip -q "$RUNNER_TEMP"/devel-archives/libdbc-dev_*_windows_amd64.zip -d "$dir"
          lib_dir=$(cd "$dir"/libdbc-dev_*_windows_amd64 && pwd -W)
          test -f "$lib_dir/libdbc.lib" && test -f "$lib_dir/libdbc.h"
          DBC_SYS_LIB_DIR="$lib_dir" cargo test --manifest-path rust/Cargo.toml -p columnar-dbc --target ${{ matrix.target }}

  devel_packages:
    name: devel packages ${{ matrix.debarch }}
    needs: snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, debarch: amd64, triplet: x86_64-linux-gnu, rpmarch: x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, debarch: arm64, triplet: aarch64-linux-gnu, rpmarch: aarch64, target: aarch64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    env:
      DEB_ARCH: ${{ matrix.debarch }}
      DEB_TRIPLET: ${{ matrix.triplet }}
      RPM_ARCH: ${{ matrix.rpmarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the snapshot's development packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devel-packages
          path: ${{ runner.temp }}/devel-packages
      # Both architectures' packages are in the artifact; lint them once.
      - name: Lint the packages with lintian and rpmlint
        if: matrix.debarch == 'amd64'
        run: scripts/lint_devel_packages.sh "$RUNNER_TEMP/devel-packages"
      - name: Install and inspect the Debian package
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/devel-packages/libdbc-dev_*_"$DEB_ARCH".deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y "${packages[0]}" pkg-config
          pkg-config --modversion dbc
          libdir="/usr/lib/$DEB_TRIPLET"
          test "$(pkg-config --variable=libdir dbc)" = "$libdir"
          for path in "$libdir/libdbc.a" "$libdir/libdbc.so" "$libdir/pkgconfig/dbc.pc" /usr/include/libdbc.h; do
            test -f "$path"
          done
          dynamic_section=$(readelf -d "$libdir/libdbc.so")
          printf '%s\n' "$dynamic_section"
          grep -Eq '\(SONAME\).*\[libdbc\.so\]' <<< "$dynamic_section"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Test Rust against the installed Debian package
        run: scripts/test_devel_rust.sh "$(mktemp -d "$RUNNER_TEMP/dbc-devel.XXXXXX")"
      - name: Install and test the RPM in Fedora
        run: |
          docker run --rm -i \
            --mount "type=bind,source=$RUNNER_TEMP/devel-packages,target=/packages,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --env RPM_ARCH \
            fedora:latest bash -s <<'FEDORA'
          set -euo pipefail
          shopt -s nullglob
          packages=(/packages/libdbc-devel*."$RPM_ARCH".rpm)
          test "${#packages[@]}" -eq 1
          dnf install -y "${packages[0]}" gcc pkgconf binutils cargo python3
          pkg-config --modversion dbc
          test "$(pkg-config --variable=libdir dbc)" = /usr/lib64
          for path in /usr/lib64/libdbc.a /usr/lib64/libdbc.so /usr/lib64/pkgconfig/dbc.pc /usr/include/libdbc.h; do
            test -f "$path"
          done
          ldconfig
          cd "$(mktemp -d)"
          cat > smoke.c <<'C'
          #include <stddef.h>
          #include <stdio.h>
          #include <libdbc.h>

          int main(void) {
              dbc_client *client = NULL;
              dbc_error *error = NULL;
              if (dbc_client_new(NULL, NULL, 0, &client, &error) != DBC_OK) {
                  fprintf(stderr, "%s\n", dbc_error_message(error));
                  dbc_error_free(error);
                  return 1;
              }
              if (client == NULL) {
                  return 1;
              }
              dbc_client_free(client);
              return 0;
          }
          C
          dynamic_flags=$(pkg-config --cflags --libs dbc)
          read -r -a dynamic_flags <<< "$dynamic_flags"
          gcc smoke.c -o smoke-dynamic "${dynamic_flags[@]}"
          static_flags=$(pkg-config --static --cflags --libs dbc)
          read -r -a static_flags <<< "$static_flags"
          # --static includes private libs, but does not force archive linkage.
          # Select libdbc.a explicitly while leaving private system libs dynamic.
          archive_selected=false
          for i in "${!static_flags[@]}"; do
            if [ "${static_flags[i]}" = -ldbc ]; then
              static_flags[i]=-l:libdbc.a
              archive_selected=true
            fi
          done
          test "$archive_selected" = true
          gcc smoke.c -o smoke-static "${static_flags[@]}"
          for mode in dynamic static; do
            linkage=$(ldd "./smoke-$mode")
            printf '%s\n%s\n' "$mode" "$linkage"
            if grep -Fq 'not found' <<< "$linkage"; then
              echo "Unresolved runtime dependency" >&2
              exit 1
            fi
            if [ "$mode" = dynamic ]; then
              grep -Fq 'libdbc.so' <<< "$linkage"
            elif grep -Fq 'libdbc.so' <<< "$linkage"; then
              echo "Static smoke program linked libdbc.so" >&2
              exit 1
            fi
            "./smoke-$mode"
          done
          # The default (pkg-config) Rust build against libdbc-devel.
          /src/scripts/test_devel_rust.sh "$(mktemp -d)"
          FEDORA
