# TEMPORARY: reproduce TestRegistrationNamespaceLockSerializesInstallCleanupAndCreateManifest on Windows. Do not merge.
name: Debug Windows flake
on: pull_request
permissions:
  contents: read
jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        load: [ 'alone', 'with-auth-load' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: go.sum
      - name: Repro
        shell: bash
        run: |
          go test -c -o config.test.exe ./config
          if [ "${{ matrix.load }}" = with-auth-load ]; then
            go test -c -o auth.test.exe ./auth
            ( for i in 1 2 3 4 5 6; do ./auth.test.exe -test.count=1 >/dev/null 2>&1; done ) &
          fi
          ./config.test.exe -test.run '^TestRegistrationNamespaceLockSerializesInstallCleanupAndCreateManifest$' -test.count=300 -test.v > out.txt 2>&1; rc=$?
          echo "exit=$rc"
          echo "passes: $(grep -c -- '--- PASS' out.txt)  fails: $(grep -c -- '--- FAIL' out.txt)"
          grep 'DEBUG:' out.txt | sed -E 's/after [0-9.]+[µm]?s/after T/; s/[0-9]+ probes/N probes/' | sort | uniq -c | sort -rn | head -20
          grep -E 'DEBUG: (sibling|.*did not)' out.txt | head -10
          grep 'DEBUG: contended' out.txt | grep -oE 'after [0-9.]+[µm]?s' | sort -t' ' -k2 -V | tail -5
          exit 0
