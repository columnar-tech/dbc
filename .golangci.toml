version = "2"

[formatters]
enable = [
  "gofmt",
]

[issues]
max-issues-per-linter = 0
max-same-issues = 0
uniq-by-line = false

[linters]
enable = [
  "govet",
  "ineffassign",
  "intrange",
  "mirror",
  "modernize",
  "nolintlint",
]

# lots of warnings - disable for now
disable = [
  "errcheck",
  "staticcheck",
  "unused",
]

[linters.settings.govet]
# appears to be broken in go 1.27
disable = ["inline"]
